modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="fluidlabel"
version="${mod_version}"
displayName="Fluid Label"
description='''为 EMI 液体图标叠加可区分的中文短标签（纯客户端）。'''
authors="GregTech Odyssey"
displayTest="IGNORE_SERVER_VERSION"      # 纯客户端：服务端有无本模组都不影响联机

[[dependencies.fluidlabel]]
  modId="forge"
  mandatory=true
  versionRange="[47,)"
  ordering="NONE"
  side="BOTH"

[[dependencies.fluidlabel]]
  modId="minecraft"
  mandatory=true
  versionRange="[1.20.1,1.21)"
  ordering="NONE"
  side="BOTH"

# ★ EMI 是软依赖：缺失时必须安静失效，绝不能 mandatory=true
[[dependencies.fluidlabel]]
  modId="emi"
  mandatory=false
  versionRange="[1.1,)"
  ordering="AFTER"
  side="CLIENT"

# ★ AE2 / GTCEu（第二阶段）同样是软依赖：缺失时必须安静失效，绝不能 mandatory=true
#   注：整合包内是 GTO 补丁版（AE2 15.267.4 / GTCEu 26.7.3），versionRange 只放下限、不设上限。
[[dependencies.fluidlabel]]
  modId="ae2"
  mandatory=false
  versionRange="[15,)"
  ordering="AFTER"
  side="CLIENT"

[[dependencies.fluidlabel]]
  modId="gtceu"
  mandatory=false
  versionRange="[1.0,)"
  ordering="AFTER"
  side="CLIENT"

# ★ LDLib（第三阶段）：GT/GTO 机器界面的液体槽由 LDLib 的绘制原语
#   com.lowdragmc.lowdraglib.gui.util.DrawerHelper#drawFluidForGui 画出。
#   同样是软依赖：缺失时注入点 5/6 静默失效，游戏不受影响。
[[dependencies.fluidlabel]]
  modId="ldlib"
  mandatory=false
  versionRange="[1.0,)"
  ordering="AFTER"
  side="CLIENT"
